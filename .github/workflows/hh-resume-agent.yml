name: HeadHunter Resume Agent

on:
  workflow_dispatch:
    inputs:
      vacancy_url:
        description: "Optional HH vacancy URL for resume comparison"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hh-resume-agent
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Inspect and review existing HeadHunter resumes (read-only)
        env:
          HH_STORAGE_STATE_JSON: \${{ secrets.HH_STORAGE_STATE_JSON }}
          HH_TARGET_VACANCY_URL: \${{ inputs.vacancy_url }}
        run: python hh_resume_agent.py > hh-resume-result.json
      - name: Publish safe summary
        if: always()
        run: |
          if [ -f hh-resume-result.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
              data = json.loads(Path("hh-resume-result.json").read_text(encoding="utf-8"))
          except Exception:
              data = {"status": "result_unavailable"}
          print("## HeadHunter agent")
          print(f"- Status: **{data.get('status', 'unknown')}**")
          print(f"- Resumes found: **{data.get('resume_count', 0)}**")
          print(f"- Resumes reviewed: **{data.get('reviewed_count', 0)}**")
          print("- Resume text and personal data are omitted from logs.")
          print("- No resume changes or applications were made.")
          PY
          fi
      - name: Encrypt private resume review report
        if: always() && hashFiles('hh-resume-result.json') != ''
        env:
          HH_REPORT_ENCRYPTION_KEY: \${{ secrets.HH_REPORT_ENCRYPTION_KEY }}
        run: |
          if [ -z "$HH_REPORT_ENCRYPTION_KEY" ]; then
            echo "::warning::Set HH_REPORT_ENCRYPTION_KEY to receive an encrypted resume report. Plaintext report will not be uploaded."
            exit 0
          fi
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass env:HH_REPORT_ENCRYPTION_KEY \
            -in hh-resume-result.json -out hh-resume-result.json.enc
          rm -f hh-resume-result.json
      - name: Upload encrypted resume review report
        if: always() && hashFiles('hh-resume-result.json.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hh-resume-review-encrypted
          path: hh-resume-result.json.enc
          retention-days: 7
