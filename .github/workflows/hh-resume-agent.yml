name: HeadHunter Resume Agent

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hh-resume-agent
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Inspect existing HeadHunter resumes (read-only)
        env:
          HH_STORAGE_STATE_JSON: ${{ secrets.HH_STORAGE_STATE_JSON }}
        run: python hh_resume_agent.py | tee hh-resume-result.json

      - name: Publish safe summary
        if: always()
        run: |
          if [ -f hh-resume-result.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
              data = json.loads(Path("hh-resume-result.json").read_text(encoding="utf-8"))
          except Exception:
              data = {"status": "result_unavailable"}
          status = data.get("status", "unknown")
          count = data.get("resume_count", 0)
          print("## HeadHunter agent")
          print(f"- Status: **{status}**")
          print(f"- Resumes found: **{count}**")
          if status == "authenticated":
              for item in data.get("resumes", []):
                  print(f"- {item.get('title', 'Untitled')}")
          else:
              print("- No resume changes were made.")
          PY
          fi
