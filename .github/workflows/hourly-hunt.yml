name: Hourly Job Hunter

on:
  schedule:
    - cron: "0 * * * *" # Every hour, 24 hours a day, including weekends
  workflow_dispatch:

concurrency:
  group: job-hunter-applications
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
      SUPERJOB_API_KEY: ${{ secrets.SUPERJOB_API_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MATCH_NOTIFY_MIN_SCORE: "70"
      AUTO_FREELANCE_APPLY: "1"
      AUTO_FREELANCE_ESTIMATED_BIDS: "1"
      FREELANCE_QUOTE_HOURLY_RATE: "750"
      FREELANCE_QUOTE_CURRENCY: "UAH"
      FREELANCEHUNT_TOKEN: ${{ secrets.FREELANCEHUNT_TOKEN }}
      AUTO_SEND_EMAIL: "1"
      SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.yandex.ru' }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      AUTO_BROWSER_APPLY: "1"
      EXTERNAL_APPLY_HOSTS: ${{ vars.EXTERNAL_APPLY_HOSTS }}
      AUTO_APPLY_QA: "1"
      REMOTE_JOB_NAME: ${{ secrets.REMOTE_JOB_NAME }}
      REMOTE_JOB_EMAIL: ${{ secrets.REMOTE_JOB_EMAIL || secrets.SMTP_USER }}
      REMOTE_JOB_PHONE: ${{ secrets.REMOTE_JOB_PHONE }}
      HH_STORAGE_STATE_JSON: ${{ secrets.HH_STORAGE_STATE_JSON }}
      DAILY_JOB_LIMIT: "0"
      DAILY_FREELANCE_LIMIT: "0"
      HOURLY_JOB_LIMIT: "0"
      HOURLY_FREELANCE_LIMIT: "0"
      HUNTER_DB: hunter.db
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Restore hunter history
        uses: actions/cache/restore@v4
        with:
          path: hunter.db
          key: hunter-db-${{ github.run_id }}
          restore-keys: |
            hunter-db-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run hunter
        run: python worker.py

      - name: Save hunter history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hunter.db
          key: hunter-db-${{ github.run_id }}

      - name: Notify Telegram on workflow failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("[telegram] failure alert disabled: missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID")
          else:
              payload = json.dumps({
                  "chat_id": chat_id,
                  "text": "Job Auto Apply: GitHub Actions завершился с ошибкой. " + os.getenv("RUN_URL", ""),
                  "disable_web_page_preview": True,
              }).encode("utf-8")
              request = urllib.request.Request(
                  "https://api.telegram.org/bot" + token + "/sendMessage",
                  data=payload, headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      print("[telegram] workflow failure alert HTTP", response.status)
              except urllib.error.HTTPError as exc:
                  print("[telegram] workflow failure alert HTTP", exc.code)
              except Exception as exc:
                  print("[telegram] workflow failure alert error", type(exc).__name__)
          PY
