name: Scheduled Job Auto Apply report

on:
  schedule:
    # Yekaterinburg (UTC+5): 08:00, 10:00, 12:00, 14:00, 16:00
    - cron: "0 3,5,7,9,11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-job-auto-apply-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger draft-only report
        env:
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
          SERVICE_URL: https://job-auto-apply-5wmf.onrender.com
        run: |
          set -euo pipefail
          if [ -z "${SCHEDULER_TOKEN}" ]; then
            echo "::error::GitHub secret SCHEDULER_TOKEN is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${SCHEDULER_TOKEN}" \
            "${SERVICE_URL}/run/scheduled"
