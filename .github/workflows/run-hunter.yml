name: Run job hunter
on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Type APPLY to authorize real applications; otherwise run in dry-run mode"
        required: true
        type: string
permissions:
  contents: read
jobs:
  run:
    if: ${{ inputs.confirm_live == 'APPLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Trigger protected Render worker
        env:
          HUNTER_RUN_TOKEN: ${{ secrets.HUNTER_RUN_TOKEN }}
          CONFIRM_LIVE: ${{ inputs.confirm_live }}
        run: |
          TOKEN="$(printf '%s' "$HUNTER_RUN_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$TOKEN" || { echo "Missing GitHub Actions secret HUNTER_RUN_TOKEN"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 3500 \
            -X POST "https://job-freelance-hunter.onrender.com/run" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-Hunter-Live-Approval: $CONFIRM_LIVE" \
            -H "Content-Type: application/json" \
            -d '{}'
