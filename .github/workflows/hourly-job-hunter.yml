name: Job hunter — reports at 08:00, 10:00, 12:00, 14:00, 16:00 Yekaterinburg

on:
  schedule:
    # Yekaterinburg is UTC+5: 03, 05, 07, 09, 11 UTC = 08, 10, 12, 14, 16 local.
    - cron: "0 3,5,7,9,11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-hunter-scheduled-report
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the scheduled draft-only run and ATS market report
        env:
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
        run: |
          test -n "$SCHEDULER_TOKEN" || { echo "Missing SCHEDULER_TOKEN repository secret"; exit 1; }
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 \
            -X POST \
            -H "Authorization: Bearer $SCHEDULER_TOKEN" \
            "https://job-freelance-hunter.onrender.com/run/scheduled"
