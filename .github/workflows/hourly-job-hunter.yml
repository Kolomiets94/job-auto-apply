name: Job hunter — reports at 08:00, 10:00, 12:00, 14:00, 16:00 Yekaterinburg

on:
  schedule:
    # Yekaterinburg is UTC+5: 03, 05, 07, 09, 11 UTC = 08, 10, 12, 14, 16 local.
    - cron: "0 3,5,7,9,11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: job-hunter-scheduled-report
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the scheduled draft-only run and ATS market report
        run: |
          TOKEN_RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fjob-freelance-hunter.onrender.com%2Frun%2Fscheduled")
          OIDC_TOKEN=$(printf '%s' "$TOKEN_RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          test -n "$OIDC_TOKEN" || { echo "Could not obtain GitHub OIDC token"; exit 1; }
          echo "::add-mask::$OIDC_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://job-freelance-hunter.onrender.com/run/scheduled"
