name: Daily evening job hunter

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-evening-job-hunter
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the daily evening draft-only run
        env:
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
        run: |
          test -n "$SCHEDULER_TOKEN" || { echo "Missing SCHEDULER_TOKEN repository secret"; exit 1; }
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 \
            -X POST \
            -H "Authorization: Bearer $SCHEDULER_TOKEN" \
            "https://job-auto-apply-5wmf.onrender.com/run/scheduled"
