name: Job hunter — every 3 hours (08:00–20:00 Yekaterinburg)

on:
  schedule:
    # Yekaterinburg is UTC+5: 03, 06, 09, 12, 15 UTC = 08, 11, 14, 17, 20 local.
    - cron: "0 3,6,9,12,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-hunter-every-3-hours
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the scheduled draft-only run and ATS market report
        env:
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
        run: |
          test -n "$SCHEDULER_TOKEN" || { echo "Missing SCHEDULER_TOKEN repository secret"; exit 1; }
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 \
            -X POST \
            -H "Authorization: Bearer $SCHEDULER_TOKEN" \
            "https://job-auto-apply-5wmf.onrender.com/run/scheduled"
